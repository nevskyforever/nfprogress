name: Cloud backend tests

on:
  push:
    paths:
      - 'backend/**'
      - 'alembic.ini'
      - 'requirements-backend.txt'
      - 'requirements-test.txt'
      - 'tests/test_api.py'
      - 'tests/test_cloud_*.py'
      - 'frontend/src/**'
      - 'frontend/src-tauri/src/note_sync.rs'
      - 'frontend/src-tauri/src/lib.rs'
      - 'frontend/package*.json'
      - 'docs/cloud/**'
      - '.github/workflows/cloud-backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'alembic.ini'
      - 'requirements-backend.txt'
      - 'requirements-test.txt'
      - 'tests/test_api.py'
      - 'tests/test_cloud_*.py'
      - 'frontend/src/**'
      - 'frontend/src-tauri/src/note_sync.rs'
      - 'frontend/src-tauri/src/lib.rs'
      - 'frontend/package*.json'
      - 'docs/cloud/**'
      - '.github/workflows/cloud-backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PostgreSQL cloud backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloud_test_user
          POSTGRES_PASSWORD: cloud_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cloud_test_user -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-backend.txt
            requirements-test.txt

      - name: Wait for PostgreSQL service
        env:
          PGPASSWORD: cloud_test_password
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U cloud_test_user -d postgres; then
              exit 0
            fi
            sleep 1
          done
          echo 'PostgreSQL service did not become ready.' >&2
          exit 1

      - name: Create disposable test database
        env:
          PGPASSWORD: cloud_test_password
        run: |
          psql -h 127.0.0.1 -p 5432 -U cloud_test_user -d postgres \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE nfprogress_c1_test'

      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-backend.txt -r requirements-test.txt

      - name: Run focused cloud and legacy API tests
        env:
          NFPROGRESS_ENV: test
          NFPROGRESS_TEST_DATABASE_URL: postgresql+psycopg://cloud_test_user:cloud_test_password@127.0.0.1:5432/nfprogress_c1_test
        run: |
          python -m pytest -q \
            tests/test_cloud_postgresql_foundation.py \
            tests/test_cloud_auth.py \
            tests/test_cloud_email_recovery.py \
            tests/test_cloud_registration.py \
            tests/test_cloud_limits.py \
            tests/test_cloud_reserved_usernames.py \
            tests/test_cloud_admin.py \
            tests/test_cloud_projects.py \
            tests/test_cloud_sync.py \
            tests/test_cloud_encrypted_schema.py \
            tests/test_cloud_encrypted_sync.py \
            tests/test_cloud_encrypted_blobs.py \
            tests/test_c9_sqlite_sync.py \
            tests/test_api.py

  frontend-admin:
    name: Frontend admin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v24
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test -- --run src/App.spec.ts src/router/index.spec.ts src/api/admin.spec.ts src/cloud/projectState.spec.ts src/cloud/syncProtocol.spec.ts src/api/base64url.spec.ts src/api/encryptedSync.spec.ts src/cloud/encryptedSyncProtocol.spec.ts src/cloud/syncTimestamp.spec.ts src/cloud/noteSyncCodec.spec.ts src/cloud/noteSyncIntent.spec.ts src/cloud/projectCoverCrypto.spec.ts src/api/encryptedCovers.spec.ts src/components/projects/projectCoverPreparation.spec.ts src/infrastructure/sqlite/noteSyncIntentRepository.spec.ts src/crypto/crypto.spec.ts src/crypto/crypto.vectors.spec.ts src/crypto/crypto.security.spec.ts src/crypto/crypto.boundary.spec.ts
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
