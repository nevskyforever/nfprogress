<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта</title>
  <link rel="stylesheet" href="MindElixir.css">
  <style>
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #f6f6f6;
      font-family: Arial, sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #666;
      background: #f6f6f6;
      z-index: 10;
    }

    #loading[hidden] {
      display: none;
    }

    me-tpc.nfprogress-read-only-stage {
      cursor: default;
      filter: saturate(0.65);
    }

    #focusBranch.nfprogress-focus-active {
      color: #4f8cff;
    }

    #floating-items {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }

    #floating-links {
      position: absolute;
      inset: 0;
      z-index: 29;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #floating-links .nfprogress-floating-link {
      pointer-events: stroke;
      cursor: pointer;
      outline: none;
    }

    #floating-links .nfprogress-floating-link.selected {
      stroke: #2f80ff;
      stroke-width: 4;
    }

    .floating-item {
      position: absolute;
      min-width: 130px;
      max-width: 260px;
      padding: 8px 10px;
      border: 1px solid #4f8cff;
      border-radius: 7px;
      box-shadow: 0 2px 8px #0002;
      color: #1f3554;
      background: #edf4ff;
      cursor: grab;
      pointer-events: auto;
      user-select: none;
    }

    .floating-item.note {
      border-color: #d1a320;
      background: #fff8cf;
      color: #594300;
    }

    .floating-item.node.root {
      border-color: #ef3b2d;
      color: #fff;
      background: #ef3124;
      font-weight: 600;
    }

    .floating-item.node:not(.root) {
      border-color: #aaa;
      color: #333;
      background: #d8d8d8;
      box-shadow: none;
    }

    .floating-item.selected {
      outline: 2px solid #276fce;
      outline-offset: 2px;
    }

    #floating-items.linking .floating-item,
    #map:has(+ #floating-links + #floating-items.linking) me-tpc {
      cursor: crosshair;
    }

    .floating-item-content {
      display: block;
      min-width: 90px;
      white-space: pre-wrap;
      user-select: text;
      cursor: text;
      outline: none;
    }

    .floating-item.note .floating-item-content::before {
      content: '📝 ';
    }

    .mind-elixir-toolbar span.nfprogress-floating-control {
      width: 22px;
      height: 22px;
      cursor: pointer;
    }

    .mind-elixir-toolbar span.nfprogress-floating-control + span {
      margin-left: 10px;
    }

    .nfprogress-search-panel {
      position: absolute;
      top: 20px;
      left: 52px;
      z-index: 40;
      width: min(330px, calc(100vw - 40px));
      padding: 7px;
      border-radius: 6px;
      background: var(--panel-bgcolor, #fff);
      box-shadow: 0 4px 14px #0003;
      opacity: 0;
      transform: translateX(-12px);
      visibility: hidden;
      transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s;
    }

    .nfprogress-search-panel.open {
      opacity: 1;
      transform: translateX(0);
      visibility: visible;
      transition-delay: 0s;
    }
    .nfprogress-search-input { width: 100%; padding: 7px; }
    .nfprogress-search-panel::before {
      content: '⌕';
      position: absolute;
      top: 12px;
      left: 16px;
      color: #667085;
      font-size: 18px;
      pointer-events: none;
    }
    .nfprogress-search-input { padding-left: 34px; }
    .nfprogress-search-results { max-height: 230px; overflow-y: auto; }
    .nfprogress-search-result {
      width: 100%; padding: 7px; border: 0; background: transparent;
      text-align: left; cursor: pointer;
    }
    .nfprogress-search-result:hover { background: #4f8cff20; }
    .nfprogress-search-empty { padding: 7px; color: #666; }

    .nfprogress-floating-menu {
      position: fixed;
      z-index: 80;
      min-width: 210px;
      overflow: hidden;
      border-radius: 5px;
      color: var(--panel-color, #222);
      background: var(--panel-bgcolor, #fff);
      box-shadow: 0 8px 20px #0004;
    }

    .nfprogress-floating-menu button {
      display: block;
      width: 100%;
      padding: 7px 11px;
      border: 0;
      border-bottom: 1px solid var(--panel-border-color, #ddd);
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .nfprogress-floating-menu button:hover { filter: brightness(.94); }
    .nfprogress-floating-menu button:last-child { border-bottom: 0; }
  </style>
</head>
<body>
  <div id="map" aria-label="Редактор карты"></div>
  <svg id="floating-links" aria-hidden="true">
    <defs>
      <marker id="nfprogress-arrowhead" markerWidth="8" markerHeight="8"
        refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L8,4 L0,8 z" fill="#7c8da8"></path>
      </marker>
    </defs>
  </svg>
  <div id="floating-items" aria-label="Свободные элементы карты"></div>
  <div id="loading" aria-live="polite">Загрузка карты…</div>
  <script type="module" src="app.js"></script>
</body>
</html>
