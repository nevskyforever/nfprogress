<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта</title>
  <link rel="stylesheet" href="MindElixir.css">
  <style>
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #f6f6f6;
      font-family: Arial, sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #666;
      background: #f6f6f6;
      z-index: 10;
    }

    #loading[hidden] {
      display: none;
    }

    me-tpc.nfprogress-read-only-stage {
      cursor: default;
      filter: saturate(0.65);
    }

    #focusBranch.nfprogress-focus-active {
      color: #4f8cff;
    }

    #floating-items {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }

    .floating-item {
      position: absolute;
      min-width: 130px;
      max-width: 260px;
      padding: 8px 10px;
      border: 1px solid #4f8cff;
      border-radius: 7px;
      box-shadow: 0 2px 8px #0002;
      color: #1f3554;
      background: #edf4ff;
      cursor: grab;
      pointer-events: auto;
      user-select: none;
    }

    .floating-item.note {
      border-color: #d1a320;
      background: #fff8cf;
      color: #594300;
    }

    .floating-item.selected {
      outline: 2px solid #276fce;
      outline-offset: 2px;
    }

    .floating-item-content {
      display: block;
      min-width: 90px;
      white-space: pre-wrap;
      user-select: text;
      cursor: text;
      outline: none;
    }

    .floating-item.note .floating-item-content::before {
      content: '📝 ';
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Редактор карты"></div>
  <div id="floating-items" aria-label="Свободные элементы карты"></div>
  <div id="loading" aria-live="polite">Загрузка карты…</div>
  <script type="module" src="app.js"></script>
</body>
</html>
