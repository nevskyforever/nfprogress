<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта</title>
  <link rel="stylesheet" href="MindElixir.css">
  <style>
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #f6f6f6;
      font-family: Arial, sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #666;
      background: #f6f6f6;
      z-index: 10;
    }

    #loading[hidden] {
      display: none;
    }

    me-tpc.nfprogress-read-only-stage {
      cursor: default;
      filter: saturate(0.65);
    }

    #focusBranch.nfprogress-focus-active {
      color: #4f8cff;
    }

    #floating-items {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }

    #floating-links {
      position: absolute;
      inset: 0;
      z-index: 29;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .floating-item {
      position: absolute;
      min-width: 130px;
      max-width: 260px;
      padding: 8px 10px;
      border: 1px solid #4f8cff;
      border-radius: 7px;
      box-shadow: 0 2px 8px #0002;
      color: #1f3554;
      background: #edf4ff;
      cursor: grab;
      pointer-events: auto;
      user-select: none;
    }

    .floating-item.note {
      border-color: #d1a320;
      background: #fff8cf;
      color: #594300;
    }

    .floating-item.selected {
      outline: 2px solid #276fce;
      outline-offset: 2px;
    }

    .floating-item-content {
      display: block;
      min-width: 90px;
      white-space: pre-wrap;
      user-select: text;
      cursor: text;
      outline: none;
    }

    .floating-item.note .floating-item-content::before {
      content: '📝 ';
    }

    .mind-elixir-toolbar span.nfprogress-floating-control {
      width: 22px;
      height: 22px;
      cursor: pointer;
    }

    .mind-elixir-toolbar span.nfprogress-floating-control + span {
      margin-left: 10px;
    }

    .nfprogress-search-panel {
      position: absolute;
      top: 52px;
      left: 20px;
      z-index: 40;
      width: min(330px, calc(100vw - 40px));
      padding: 7px;
      border-radius: 6px;
      background: var(--panel-bgcolor, #fff);
      box-shadow: 0 4px 14px #0003;
    }

    .nfprogress-search-panel[hidden] { display: none; }
    .nfprogress-search-input { width: 100%; padding: 7px; }
    .nfprogress-search-results { max-height: 230px; overflow-y: auto; }
    .nfprogress-search-result {
      width: 100%; padding: 7px; border: 0; background: transparent;
      text-align: left; cursor: pointer;
    }
    .nfprogress-search-result:hover { background: #4f8cff20; }
    .nfprogress-search-empty { padding: 7px; color: #666; }
  </style>
</head>
<body>
  <div id="map" aria-label="Редактор карты"></div>
  <svg id="floating-links" aria-hidden="true"></svg>
  <div id="floating-items" aria-label="Свободные элементы карты"></div>
  <div id="loading" aria-live="polite">Загрузка карты…</div>
  <script type="module" src="app.js"></script>
</body>
</html>
