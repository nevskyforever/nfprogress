name: Cloud backend tests

on:
  push:
    paths:
      - 'backend/**'
      - 'alembic.ini'
      - 'requirements-backend.txt'
      - 'requirements-test.txt'
      - 'tests/test_api.py'
      - 'tests/test_cloud_*.py'
      - 'frontend/src/**'
      - 'frontend/src-tauri/src/note_sync.rs'
      - 'frontend/src-tauri/src/c15_headless_test_bridge.rs'
      - 'frontend/src-tauri/src/lib.rs'
      - 'frontend/src-tauri/src/sqlite.rs'
      - 'frontend/src-tauri/src/project_repository.rs'
      - 'nfprogress/core/sqlite/**'
      - 'frontend/package*.json'
      - 'docs/cloud/**'
      - '.github/workflows/cloud-backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'alembic.ini'
      - 'requirements-backend.txt'
      - 'requirements-test.txt'
      - 'tests/test_api.py'
      - 'tests/test_cloud_*.py'
      - 'frontend/src/**'
      - 'frontend/src-tauri/src/note_sync.rs'
      - 'frontend/src-tauri/src/c15_headless_test_bridge.rs'
      - 'frontend/src-tauri/src/lib.rs'
      - 'frontend/src-tauri/src/sqlite.rs'
      - 'frontend/src-tauri/src/project_repository.rs'
      - 'nfprogress/core/sqlite/**'
      - 'frontend/package*.json'
      - 'docs/cloud/**'
      - '.github/workflows/cloud-backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PostgreSQL cloud backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloud_test_user
          POSTGRES_PASSWORD: cloud_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cloud_test_user -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-backend.txt
            requirements-test.txt

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v24
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install native headless proof dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Wait for PostgreSQL service
        env:
          PGPASSWORD: cloud_test_password
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U cloud_test_user -d postgres; then
              exit 0
            fi
            sleep 1
          done
          echo 'PostgreSQL service did not become ready.' >&2
          exit 1

      - name: Create disposable test database
        env:
          PGPASSWORD: cloud_test_password
        run: |
          psql -h 127.0.0.1 -p 5432 -U cloud_test_user -d postgres \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE nfprogress_c1_test'

      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-backend.txt -r requirements-test.txt

      - name: Install frontend dependencies for production crypto bridge
        run: npm ci
        working-directory: frontend

      - name: Run mandatory sync ACK and two-device backend acceptance without skips
        env:
          NFPROGRESS_ENV: test
          NFPROGRESS_TEST_DATABASE_URL: postgresql+psycopg://cloud_test_user:cloud_test_password@127.0.0.1:5432/nfprogress_c1_test
        run: |
          acceptance_output="$(python -m pytest -q -rs tests/test_cloud_sync.py tests/test_cloud_two_device_acceptance.py tests/test_cloud_c15_headless_cross_runtime.py tests/test_cloud_project_bootstrap.py tests/test_cloud_c16_bootstrap_cross_runtime.py)"
          echo "$acceptance_output"
          if echo "$acceptance_output" | grep -Eiq '[0-9]+ skipped|SKIPPED'; then
            echo 'Mandatory sync acceptance unexpectedly skipped tests.' >&2
            exit 1
          fi

      - name: Run focused cloud and legacy API tests
        env:
          NFPROGRESS_ENV: test
          NFPROGRESS_TEST_DATABASE_URL: postgresql+psycopg://cloud_test_user:cloud_test_password@127.0.0.1:5432/nfprogress_c1_test
        run: |
          python -m pytest -q \
            tests/test_cloud_postgresql_foundation.py \
            tests/test_cloud_auth.py \
            tests/test_cloud_email_recovery.py \
            tests/test_cloud_registration.py \
            tests/test_cloud_limits.py \
            tests/test_cloud_reserved_usernames.py \
            tests/test_cloud_admin.py \
            tests/test_cloud_projects.py \
            tests/test_cloud_encrypted_schema.py \
            tests/test_cloud_encrypted_sync.py \
            tests/test_cloud_encrypted_blobs.py \
            tests/test_c9_sqlite_sync.py \
            tests/test_api.py

  frontend-admin:
    name: Frontend admin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v24
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test -- --run src/App.spec.ts src/router/index.spec.ts src/api/admin.spec.ts src/api/client.spec.ts src/api/accountCrypto.spec.ts src/api/cloudProjects.spec.ts src/auth/userAuth.spec.ts src/auth/accountBinding.spec.ts src/auth/keyContext.spec.ts src/cloud/accountCryptoProvisioning.spec.ts src/stores/cloudSession.spec.ts src/components/settings/CloudSyncSettingsCard.spec.ts src/cloud/projectState.spec.ts src/cloud/projectBootstrap.spec.ts src/cloud/syncProtocol.spec.ts src/api/base64url.spec.ts src/api/encryptedSync.spec.ts src/cloud/encryptedSyncProtocol.spec.ts src/cloud/noteSyncTwoDeviceCryptoAcceptance.spec.ts src/cloud/noteSyncHeadlessCryptoBridge.spec.ts src/cloud/syncTimestamp.spec.ts src/cloud/noteSyncCodec.spec.ts src/cloud/noteSyncCodec.golden.spec.ts src/cloud/noteSyncIntent.spec.ts src/cloud/noteSyncIntent.authority.spec.ts src/cloud/noteSyncUpload.spec.ts src/cloud/noteSyncPull.spec.ts src/cloud/noteSyncInbox.spec.ts src/cloud/noteSyncInboxDecrypt.spec.ts src/cloud/noteSyncInboxApply.spec.ts src/cloud/noteSyncDeviceAck.spec.ts src/cloud/noteSyncOrchestrator.spec.ts src/cloud/noteSyncRuntime.spec.ts src/cloud/projectCoverCrypto.spec.ts src/api/encryptedCovers.spec.ts src/components/projects/projectCoverPreparation.spec.ts src/infrastructure/sqlite/cloudAccountBindingRepository.spec.ts src/infrastructure/sqlite/cloudIdentityRepository.spec.ts src/infrastructure/sqlite/cloudProjectBootstrapRepository.spec.ts src/infrastructure/sqlite/noteSyncIntentRepository.spec.ts src/infrastructure/sqlite/noteSyncOutboxRepository.spec.ts src/infrastructure/sqlite/noteSyncAckRepository.spec.ts src/crypto/crypto.spec.ts src/crypto/crypto.vectors.spec.ts src/crypto/crypto.security.spec.ts src/crypto/crypto.boundary.spec.ts
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
