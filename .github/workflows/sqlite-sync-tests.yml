name: SQLite sync substrate tests

on:
  push:
    paths:
      - 'nfprogress/core/sqlite/**'
      - 'frontend/src-tauri/src/sqlite.rs'
      - 'frontend/src-tauri/Cargo.toml'
      - 'frontend/src-tauri/Cargo.lock'
      - 'tests/test_c9_sqlite_sync.py'
      - 'tests/test_application_metadata.py'
      - 'tests/test_f8_recovery.py'
      - 'tests/test_api.py'
      - '.github/workflows/sqlite-sync-tests.yml'
  pull_request:
    paths:
      - 'nfprogress/core/sqlite/**'
      - 'frontend/src-tauri/src/sqlite.rs'
      - 'frontend/src-tauri/Cargo.toml'
      - 'frontend/src-tauri/Cargo.lock'
      - 'tests/test_c9_sqlite_sync.py'
      - 'tests/test_application_metadata.py'
      - 'tests/test_f8_recovery.py'
      - 'tests/test_api.py'
      - '.github/workflows/sqlite-sync-tests.yml'

permissions:
  contents: read

jobs:
  python-sqlite:
    name: Python SQLite substrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-backend.txt
            requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-backend.txt -r requirements-test.txt

      - name: Run SQLite substrate and API regressions
        run: |
          python -m pytest -q \
            tests/test_c9_sqlite_sync.py \
            tests/test_application_metadata.py \
            tests/test_f8_recovery.py \
            tests/test_api.py

  rust-sqlite:
    name: Rust SQLite substrate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust/MSVC
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run Rust SQLite tests and check
        shell: pwsh
        run: |
          cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc sqlite
          cargo check --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc
