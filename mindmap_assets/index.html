<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта</title>
  <link rel="stylesheet" href="MindElixir.css">
  <style>
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #f6f6f6;
      font-family: Arial, sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #666;
      background: #f6f6f6;
      z-index: 10;
    }

    #loading[hidden] {
      display: none;
    }

    me-tpc.nfprogress-read-only-stage {
      cursor: default;
      filter: saturate(0.65);
    }

    #focusBranch.nfprogress-focus-active {
      color: #4f8cff;
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Редактор карты"></div>
  <div id="loading" aria-live="polite">Загрузка карты…</div>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
