permissions:
  contents: read

jobs:
  python-sqlite:
    name: Python SQLite substrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-backend.txt
            requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-backend.txt -r requirements-test.txt

      - name: Run SQLite substrate and API regressions
        run: |
          python -m pytest -q \
            tests/test_c9_sqlite_sync.py \
            tests/test_c18_metadata_sqlite.py tests/test_c18_cover_sqlite.py tests/test_c18_external_local_boundary.py \
            tests/test_c18_stage_sqlite.py \
            tests/test_c18_account_sqlite.py \
            tests/test_c18_catalog_sqlite.py tests/test_c18_content_note_sqlite.py tests/test_c18_map_sqlite.py tests/test_c18_document_sqlite.py tests/test_c18_progress_sqlite.py tests/test_c18_game_sqlite.py tests/test_c18_content_action_integration.py \
            tests/test_c15_7b_cross_runtime_udf_proof.py \
            tests/test_application_metadata.py \
            tests/test_f8_recovery.py \
            tests/test_api.py

  rust-sqlite:
    name: Rust SQLite substrate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust/MSVC
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run Rust SQLite filter
        shell: pwsh
        run: cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc sqlite

      - name: Run Rust Note sync filter
        shell: pwsh
        run: cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc note_sync

      - name: Run Rust account binding filter
        shell: pwsh
        run: cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc account_binding

      - name: Run Rust project lifecycle guard filter
        shell: pwsh
        run: cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc project_repository

      - name: Run Rust project metadata substrate filter
        shell: pwsh
        run: cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc project_metadata_

      - name: Run Rust stage structural substrate filter
        shell: pwsh
        run: cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc stage_sync

      - name: Run local diagnostics and developer streak regression filters
        shell: pwsh
        run: |
          cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc developer_

      - name: Run Rust account transport and vector proof
        shell: pwsh
        run: cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc account_sync

      - name: Check Rust SQLite substrate
        shell: pwsh
        run: cargo check --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc

      - name: Verify account catalog durable substrate
        run: cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc account_catalog

      - name: Verify content Note durable readers and writers
        run: cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc content_note

      - name: Verify map codec and durable authority
        shell: pwsh
        run: |
          cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc map_codec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc map_sync

      - name: Native local external reattachment safety
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --lib external_reattach

      - name: Native document codec and authority
        shell: pwsh
        run: |
          cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc document_codec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc document_sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native progress codec and authority
        shell: pwsh
        run: |
          cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc progress_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Game codec vectors
        shell: pwsh
        run: cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc game_
