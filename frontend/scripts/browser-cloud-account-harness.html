<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Browser cloud account acceptance</title></head>
<body>
<div id="app"></div>
<script type="module">
import { createApp } from 'vue'
import { createPinia } from 'pinia'
import { BrowserCloudAccountSession } from '../src/platform/web/cloudAccountSession.ts'
import BrowserCloudAccountCard from '../src/components/settings/BrowserCloudAccountCard.vue'
import { NormalUserAuthRuntime } from '../src/auth/userAuth.ts'
import { generateAccountMasterKey, wrapAmkWithPassphrase, encryptObjectBytes } from '../src/crypto/index.ts'
import { encodeBase64Url } from '../src/api/base64url.ts'
import { localCanonicalBytes } from '../src/platform/web/localAuthorityRecords.ts'
import { canonicalizeSyncTimestamp } from '../src/cloud/syncTimestamp.ts'

const users = {
  one: '11111111-1111-4111-8111-111111111111',
  two: '22222222-2222-4222-8222-222222222222',
}
const harness = {
  records: {},
  cardApp: null,
  failCrypto: false,
  pauseCrypto: false,
  resumeCrypto: null,
  async createRecords(seedV10 = false, seedV11 = false) {
    for (const name of Object.keys(users)) {
      const amk = await generateAccountMasterKey()
      try {
        const wrapped = await wrapAmkWithPassphrase(amk, 'encryption-password')
        this.records[name] = {
          provisioned: true,
          password: {
            crypto_version: wrapped.crypto_version,
            wrapping_version: wrapped.wrapping_version,
            kdf: { ...wrapped.kdf, salt: encodeBase64Url(wrapped.kdf.salt) },
            nonce: encodeBase64Url(wrapped.nonce),
            ciphertext: encodeBase64Url(wrapped.ciphertext),
          },
          recovery: null,
        }
        if (seedV10 && name === 'one') await this.seedV10(amk)
        if (seedV11 && name === 'one') await this.seedV11(amk)
      } finally { amk.fill(0) }
    }
    return structuredClone(this.records)
  },
  async seedV10(amk) {
    const accountId = crypto.randomUUID(), deviceId = crypto.randomUUID(), projectId = 'v10-private-project', noteId = 'v10-private-note'
    const at = canonicalizeSyncTimestamp('2026-10-20T12:00:00Z')
    const project = { id: projectId, name: 'PRIVATE_V10_PROJECT', goal: null, infinite: true, unit: 'symbols', status: 'active', created_at: at, updated_at: at, payload: {} }
    const note = { id: noteId, project_id: projectId, stage_id: null, source_type: 'project', source_map_id: null, source_node_id: null, content_format: 'html', title: 'PRIVATE_V10_NOTE', content: 'PRIVATE_V10_BODY', checklist: [], color: 'default', pinned: false, archived: false, sort_order: 0, tags: [], created_at: at, updated_at: at, metadata: {}, revision: 0 }
    const seal = async (entityId, entityType, payload) => {
      const bytes = localCanonicalBytes(payload)
      try {
        const encrypted = await encryptObjectBytes(amk, { userId: users.one, projectId, entityId, entityType }, bytes)
        try { return { crypto_version: 1, aad_version: 1, nonce: encodeBase64Url(encrypted.nonce), ciphertext: encodeBase64Url(encrypted.ciphertext) } }
        finally { encrypted.nonce.fill(0); encrypted.ciphertext.fill(0) }
      } finally { bytes.fill(0) }
    }
    const projectRow = { record_version: 1, account_id: accountId, device_id: deviceId, project_id: projectId, source_revision: 1, deleted: false, envelope: await seal(projectId, 'project_metadata', { local_format: 1, kind: 'project', account_id: accountId, device_id: deviceId, project_id: projectId, source_revision: 1, deleted_at: null, project, member_ids: [noteId] }) }
    const noteRow = { record_version: 1, account_id: accountId, device_id: deviceId, project_id: projectId, note_id: noteId, source_revision: 1, note_revision: 0, deleted: false, envelope: await seal(noteId, 'note', { local_format: 1, kind: 'note', account_id: accountId, device_id: deviceId, project_id: projectId, note_id: noteId, source_revision: 1, source: { state: 'live', note } }) }
    const schema = [
      ['identities', 'canonical_user_id', [['local_account_id', 'local_account_id', true], ['device_id', 'device_id', true]]],
      ['accountBindings', 'local_account_id', [['canonical_user_id', 'canonical_user_id', true]]],
      ['outbox', ['account_id', 'event_id'], [['ordinal', ['account_id', 'device_id', 'local_ordinal'], true], ['state', ['account_id', 'state', 'local_ordinal'], false]]],
      ['inbox', ['account_id', 'server_sequence'], [['event', ['account_id', 'event_id'], true], ['state', ['account_id', 'state', 'server_sequence'], false]]],
      ['cursors', ['account_id', 'device_id'], []],
      ['receipts', ['account_id', 'event_id'], [['server_sequence', ['account_id', 'server_sequence'], true]]],
      ['projectBindings', ['account_id', 'project_id'], [['bootstrap', ['account_id', 'bootstrap_id'], true]]],
      ['ownerHeads', ['account_id', 'owner_kind', 'owner_id'], []],
      ['localProjects', ['account_id', 'project_id'], []],
      ['localNotes', ['account_id', 'project_id', 'note_id'], [['identity', ['account_id', 'note_id'], true]]],
      ['legacyNoteHistory', ['account_id', 'project_id', 'note_id', 'record_kind', 'record_id'], [['event', ['account_id', 'event_id'], true]]],
      ['legacyNoteIntents', ['account_id', 'event_id'], [['note', ['account_id', 'project_id', 'note_id'], true], ['ordinal', ['account_id', 'device_id', 'local_ordinal'], true]]],
    ]
    const request = indexedDB.open('worta-web', 10)
    request.onupgradeneeded = () => {
      for (const [name, keyPath, indexes] of schema) {
        const store = request.result.createObjectStore(name, { keyPath })
        for (const [index, path, unique] of indexes) store.createIndex(index, path, { unique })
      }
    }
    const db = await new Promise((resolve, reject) => { request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error) })
    try {
      await new Promise((resolve, reject) => {
        const tx = db.transaction(['identities', 'accountBindings', 'localProjects', 'localNotes'], 'readwrite')
        tx.objectStore('identities').add({ canonical_user_id: users.one, local_account_id: accountId, device_id: deviceId, record_version: 1 })
        tx.objectStore('accountBindings').add({ canonical_user_id: users.one, local_account_id: accountId, record_version: 1 })
        tx.objectStore('localProjects').add(projectRow)
        tx.objectStore('localNotes').add(noteRow)
        tx.oncomplete = resolve; tx.onabort = () => reject(tx.error)
      })
    } finally { db.close() }
  },
  async seedV11(amk) {
    const upgrade = indexedDB.open('worta-web', 11)
    upgrade.onupgradeneeded = () => upgrade.result.createObjectStore('localStages', { keyPath: ['account_id', 'project_id', 'stage_id'] })
    const db = await new Promise((resolve, reject) => { upgrade.onsuccess = () => resolve(upgrade.result); upgrade.onerror = () => reject(upgrade.error) })
    try {
      const identity = await new Promise((resolve, reject) => {
        const read = db.transaction('identities').objectStore('identities').get(users.one)
        read.onsuccess = () => resolve(read.result)
        read.onerror = () => reject(read.error)
      })
      const projectId = 'v10-private-project', stageId = 'legacy-v11-stage', at = canonicalizeSyncTimestamp('2026-10-20T12:00:00Z')
      const stage = { name: 'PRIVATE_V11_STAGE', goal: null, infinite: true, unit: 'symbols', status: 'активен', deadline: null,
        personal_goal: 0, auto_freeze: true, streak_enabled: false, work_method: 'manual', created_at: at, completed_at: null }
      const payload = { local_format: 1, kind: 'stage', account_id: identity.local_account_id, device_id: identity.device_id,
        project_id: projectId, stage_id: stageId, revision: 1, sort_order: 0, updated_at: at, stage }
      const bytes = localCanonicalBytes(payload)
      const encrypted = await encryptObjectBytes(amk, { userId: users.one, projectId, entityId: stageId, entityType: 'stage' }, bytes)
      const envelope = { crypto_version: 1, aad_version: 1, nonce: encodeBase64Url(encrypted.nonce), ciphertext: encodeBase64Url(encrypted.ciphertext) }
      bytes.fill(0); encrypted.nonce.fill(0); encrypted.ciphertext.fill(0)
      await new Promise((resolve, reject) => {
        const tx = db.transaction(['localStages', 'cursors'], 'readwrite')
        tx.objectStore('localStages').add({ record_version: 1, account_id: identity.local_account_id, device_id: identity.device_id,
          project_id: projectId, stage_id: stageId, revision: 1, envelope })
        tx.objectStore('cursors').add({ record_version: 1, account_id: identity.local_account_id, device_id: identity.device_id,
          pull_cursor: 0, ack_cursor: 0, proven_prefix: 0, next_local_ordinal: 1 })
        tx.oncomplete = resolve; tx.onabort = () => reject(tx.error)
      })
    } finally { db.close() }
  },
  realSession() { return new BrowserCloudAccountSession() },
  mountAccountCard() {
    this.cardApp?.unmount()
    this.cardApp = createApp(BrowserCloudAccountCard)
    this.cardApp.use(createPinia())
    this.cardApp.mount(document.querySelector('#app'))
  },
  unmountAccountCard() { this.cardApp?.unmount(); this.cardApp = null },
  session() {
    const auth = new NormalUserAuthRuntime({
      async login(name, password) {
        if (!(name in users) || password !== 'account-password') throw Error('synthetic_login_rejected')
        return { access_token: `synthetic-access-${name}`, refresh_token: `synthetic-refresh-${name}`, access_expires_in: 60 }
      },
      async me(token) {
        const name = token.slice('synthetic-access-'.length)
        return { id: users[name], username: name, email: `${name}@example.test`, email_verified: true, role: 'user', status: 'active', created_at: '2026-01-01T00:00:00Z' }
      },
      async logout() {},
      async refresh() { throw Error('refresh_not_used') },
    })
    return new BrowserCloudAccountSession({
      auth,
      legalTransport: {
        async status() { return { documents: [], missing_required_document_ids: [] } },
        async accept() { return { documents: [], missing_required_document_ids: [] } },
      },
      cryptoTransport: { get: async token => {
        if (harness.pauseCrypto) await new Promise(resolve => { harness.resumeCrypto = resolve })
        if (harness.failCrypto) throw Error('synthetic_network_failure')
        return harness.records[token.slice('synthetic-access-'.length)]
      } },
    })
  },
  async rows(store) {
    const request = indexedDB.open('worta-web')
    const db = await new Promise((resolve, reject) => { request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error) })
    try {
      return await new Promise((resolve, reject) => {
        const read = db.transaction(store).objectStore(store).getAll()
        read.onsuccess = () => resolve(read.result)
        read.onerror = () => reject(read.error)
      })
    } finally { db.close() }
  },
}
window.harness = harness
</script>
</body>
</html>
