permissions:
  contents: read

jobs:
  mandatory:
    name: PostgreSQL mandatory (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Stable file families, independent runner/service per shard; no order-based balancing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: foundation
            tests: >-
              tests/test_cloud_sync.py
              tests/test_cloud_two_device_acceptance.py
              tests/test_cloud_c15_headless_cross_runtime.py
              tests/test_cloud_c17_v2_two_device_acceptance.py
              tests/test_cloud_c17_v2_three_device_conflict_acceptance.py
              tests/test_cloud_project_bootstrap.py
              tests/test_cloud_c16_bootstrap_cross_runtime.py
              tests/test_cloud_c18_metadata.py
              tests/test_cloud_c18_cover_gate.py
              tests/test_cloud_c18_cover_acceptance.py
              tests/test_cloud_c18_account.py
              tests/test_cloud_c18_structural.py
              tests/test_cloud_c18_structural_cross_runtime.py
              tests/test_cloud_c18_structural_integration.py
              tests/test_cloud_c18_catalog_integration.py
              tests/test_cloud_c18_authority_cross_runtime.py
              tests/test_cloud_c18_edges_cross_runtime.py
              tests/test_cloud_c18_compression_gate.py
              tests/test_cloud_c18_compression_acceptance.py
          - shard: content-action
            tests: >-
              tests/test_cloud_c18_content_note_gate.py
              tests/test_cloud_c18_content_note_acceptance.py
              tests/test_cloud_c18_map_gate.py
              tests/test_cloud_c18_map_acceptance.py
              tests/test_cloud_c18_document_gate.py
              tests/test_cloud_c18_document_acceptance.py
              tests/test_cloud_c18_external_progress_acceptance.py
              tests/test_cloud_c18_progress_gate.py
              tests/test_cloud_c18_game_gate.py
              tests/test_cloud_c18_game_acceptance.py
              tests/test_cloud_c18_content_action_integration.py
              tests/test_cloud_c18_progress_acceptance.py
          # Integrated history has its own service/budget; accepted families stay intact.
          - shard: complete-project
            tests: >-
              tests/test_cloud_c18_complete_project_acceptance.py
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloud_test_user
          POSTGRES_PASSWORD: cloud_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cloud_test_user -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-backend.txt
            requirements-test.txt

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v24
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install native headless proof dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Wait for PostgreSQL service
        env:
          PGPASSWORD: cloud_test_password
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U cloud_test_user -d postgres; then
              exit 0
            fi
            sleep 1
          done
          echo 'PostgreSQL service did not become ready.' >&2
          exit 1

      - name: Create disposable test database
        env:
          PGPASSWORD: cloud_test_password
        run: |
          psql -h 127.0.0.1 -p 5432 -U cloud_test_user -d postgres \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE nfprogress_c1_test'

      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-backend.txt -r requirements-test.txt

      - name: Install frontend dependencies for production crypto bridge
        run: npm ci
        working-directory: frontend

      - name: Prepare native bridge once before cross-runtime acceptance
        if: matrix.shard == 'content-action' || matrix.shard == 'foundation'
        run: python tests/prepare_c15_native_bridge.py

      - name: Run isolated C21 recovery and historical Metadata contract tests
        if: matrix.shard == 'foundation'
        working-directory: frontend
        run: npm test -- --run src/platform/web/v10MixedRecovery.spec.ts src/platform/web/postFMetadataBoundary.spec.ts src/platform/web/historicalMetadataDependency.spec.ts src/platform/web/historicalContentAuthentication.spec.ts src/platform/web/historicalPrefixQualification.spec.ts --maxWorkers=1

      - name: Run isolated private Metadata prerequisite contract tests
        if: matrix.shard == 'content-action'
        working-directory: frontend
        run: npm test -- --run src/platform/web/privateMetadataAuthentication.spec.ts src/platform/web/privateMetadataHandoff.spec.ts --maxWorkers=1

      - name: Run isolated post-F Metadata routing and historical cursor contract tests
        if: matrix.shard == 'foundation'
        working-directory: frontend
        run: npm test -- --run src/platform/web/postFMetadataRecovery.spec.ts src/platform/web/privateMetadataPrefix.spec.ts --maxWorkers=1

      # FASTTRACK.03: foundation completed in about 33m in run 40294292420; keep its current load unchanged.
      - name: Verify isolated Legacy3 G and independent O/Q authorities
        if: matrix.shard == 'foundation'
        working-directory: frontend
        run: npm test -- --run src/platform/web/legacy3Prefix.spec.ts src/platform/web/legacy3OrdinaryPrefix.spec.ts --maxWorkers=1

      - name: Install pinned Chromium for historical Metadata acceptance
        if: matrix.shard == 'content-action'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build historical Metadata acceptance harness
        if: matrix.shard == 'content-action'
        working-directory: frontend
        run: npx vite build --config scripts/vite.persistence-acceptance.config.ts

      - name: Start historical Metadata acceptance preview
        if: matrix.shard == 'content-action'
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 5174 --strictPort --outDir .c21-persistence-dist > "$RUNNER_TEMP/c21-historical-metadata-preview.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5174/scripts/browser-persistence-harness.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/c21-historical-metadata-preview.log"
          exit 1

      # FASTTRACK.03 estimate: content-action 22m30s observed + 3m11s moved browser checks = 25m41s.
      - name: Verify Legacy3 G cursor-only commit, restart and pinned old-U rejection
        if: matrix.shard == 'content-action'
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os, subprocess, tempfile
          from pathlib import Path
          baseline_sha = '22b68493daf304c219bed14f0d8598d65fcc1ee8'
          subprocess.run(['git', 'fetch', '--no-tags', 'origin', baseline_sha], check=True)
          with tempfile.TemporaryDirectory(prefix='c21-old-u-g-', dir=os.environ['RUNNER_TEMP']) as directory:
              old = Path(directory)
              with tempfile.TemporaryFile() as archive:
                  subprocess.run(['git', '-C', '..', 'archive', baseline_sha, 'frontend'], stdout=archive, check=True)
                  archive.seek(0)
                  subprocess.run(['tar', '-x', '-C', directory], stdin=archive, check=True)
              (old / 'frontend/node_modules').symlink_to(Path.cwd() / 'node_modules', target_is_directory=True)
              subprocess.run(['node_modules/.bin/vite', 'build', '--config', 'scripts/vite.persistence-acceptance.config.ts'], cwd=old / 'frontend', check=True)
              bundle = old / 'frontend/.c21-persistence-dist'
              (bundle / 'baseline.sha').write_text(baseline_sha + '\n')
              subprocess.run(['node', 'scripts/browser-resolution-prefix-acceptance.mjs', 'http://127.0.0.1:5174', '--legacy3-prefix'], env=dict(os.environ, C21_OLD_U_BUNDLE=str(bundle)), check=True)
          PYCODE

      # The moved Metadata browser checks reuse the Chromium install and preview above.
      - name: Verify Legacy3 O apply, Q cursor commit and pinned old-W rejection
        if: matrix.shard == 'content-action'
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os, subprocess, tempfile
          from pathlib import Path
          baseline_sha = 'dc5cad87e9bf07b6d529e702ecdeaad988d3a5cf'
          subprocess.run(['git', 'fetch', '--no-tags', 'origin', baseline_sha], check=True)
          with tempfile.TemporaryDirectory(prefix='c21-old-w-oq-', dir=os.environ['RUNNER_TEMP']) as directory:
              old = Path(directory)
              with tempfile.TemporaryFile() as archive:
                  subprocess.run(['git', '-C', '..', 'archive', baseline_sha, 'frontend'], stdout=archive, check=True)
                  archive.seek(0)
                  subprocess.run(['tar', '-x', '-C', directory], stdin=archive, check=True)
              (old / 'frontend/node_modules').symlink_to(Path.cwd() / 'node_modules', target_is_directory=True)
              subprocess.run(['node_modules/.bin/vite', 'build', '--config', 'scripts/vite.persistence-acceptance.config.ts'], cwd=old / 'frontend', check=True)
              bundle = old / 'frontend/.c21-persistence-dist'
              (bundle / 'baseline.sha').write_text(baseline_sha + '\n')
              subprocess.run(['node', 'scripts/browser-resolution-prefix-acceptance.mjs', 'http://127.0.0.1:5174', '--legacy3-oq'], env=dict(os.environ, C21_OLD_W_BUNDLE=str(bundle)), check=True)
          PYCODE

      - name: Verify read-only historical Metadata dependency and disk reopen
        if: matrix.shard == 'content-action'
        working-directory: frontend
        run: node scripts/browser-v10-ordinary-boundary-acceptance.mjs http://127.0.0.1:5174 --historical-metadata --historical-content --historical-prefix

      - name: Verify private Metadata atomic handoff and disk recovery
        if: matrix.shard == 'content-action'
        working-directory: frontend
        run: node scripts/browser-v10-ordinary-boundary-acceptance.mjs http://127.0.0.1:5174 --private-metadata

      - name: Verify post-F Metadata routing and separate historical cursor recovery
        if: matrix.shard == 'content-action'
        working-directory: frontend
        run: node scripts/browser-v10-ordinary-boundary-acceptance.mjs http://127.0.0.1:5174 --post-f-metadata

      - name: Prepare complete-project native bridge before cross-runtime acceptance
        if: matrix.shard == 'complete-project'
        run: python tests/prepare_c15_native_bridge.py

      - name: Verify native Note legacy and framed readers
        if: matrix.shard == 'foundation'
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib note_sync

      - name: Verify native account catalog
        if: matrix.shard == 'foundation'
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib account_catalog

      - name: Verify native account transport and crypto vector boundary
        if: matrix.shard == 'foundation'
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib account_sync

      - name: Native bounded compression and cross-language vectors
        if: matrix.shard == 'foundation'
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib frame_compression

      - name: Native metadata cover vectors and atomic apply
        if: matrix.shard == 'foundation'
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib cover_

      - name: Native document codec and authority
        if: matrix.shard == 'foundation'
        run: |
          cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib document_codec
          cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib document_sync
          cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib progress_

      - name: Run mandatory sync ACK and multi-device backend acceptance without skips
        env:
          NFPROGRESS_ENV: test
          NFPROGRESS_TEST_DATABASE_URL: postgresql+psycopg://cloud_test_user:cloud_test_password@127.0.0.1:5432/nfprogress_c1_test
        run: |
          set +e
          set -o pipefail
          python -m pytest -q -rs ${{ matrix.tests }} 2>&1 | tee "$RUNNER_TEMP/c16-mandatory-acceptance.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if [ "${statuses[0]}" -ne 0 ] || [ "${statuses[1]}" -ne 0 ]; then
            echo 'Mandatory sync acceptance failed; pytest output is above.' >&2
            exit 1
          fi
          if grep -Eiq '[0-9]+ skipped|SKIPPED' "$RUNNER_TEMP/c16-mandatory-acceptance.log"; then
            echo 'Mandatory sync acceptance unexpectedly skipped tests.' >&2
            exit 1
          fi

  regressions:
    name: PostgreSQL cloud and legacy regressions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloud_test_user
          POSTGRES_PASSWORD: cloud_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cloud_test_user -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-backend.txt
            requirements-test.txt

      - name: Wait for PostgreSQL service
        env:
          PGPASSWORD: cloud_test_password
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U cloud_test_user -d postgres; then
              exit 0
            fi
            sleep 1
          done
          echo 'PostgreSQL service did not become ready.' >&2
          exit 1

      - name: Create disposable test database
        env:
          PGPASSWORD: cloud_test_password
        run: |
          psql -h 127.0.0.1 -p 5432 -U cloud_test_user -d postgres \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE nfprogress_c1_test'

      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-backend.txt -r requirements-test.txt

      - name: Run focused cloud and legacy API tests
        env:
          NFPROGRESS_ENV: test
          NFPROGRESS_TEST_DATABASE_URL: postgresql+psycopg://cloud_test_user:cloud_test_password@127.0.0.1:5432/nfprogress_c1_test
        run: |
          python -m pytest -q \
            tests/test_cloud_postgresql_foundation.py \
            tests/test_cloud_resource_limits.py \
            tests/test_backend_production_boundary.py \
            tests/test_cloud_auth.py \
            tests/test_cloud_email_recovery.py \
            tests/test_cloud_registration.py \
            tests/test_cloud_limits.py \
            tests/test_cloud_reserved_usernames.py \
            tests/test_cloud_admin.py \
            tests/test_cloud_invitations.py \
            tests/test_cloud_legal_acceptance.py \
            tests/test_cloud_projects.py \
            tests/test_cloud_encrypted_schema.py \
            tests/test_cloud_encrypted_sync.py \
            tests/test_cloud_encrypted_sync_v2.py \
            tests/test_cloud_encrypted_blobs.py \
            tests/test_c9_sqlite_sync.py \
            tests/test_api.py tests/test_c18_external_local_boundary.py tests/test_c18_compression_distribution.py

      - name: Rehearse isolated PostgreSQL and encrypted blob restore
        run: bash scripts/maintenance/run_cloud_restore_preflight.sh

