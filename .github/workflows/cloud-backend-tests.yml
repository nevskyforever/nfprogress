permissions:
  contents: read

jobs:
  mandatory:
    name: PostgreSQL mandatory (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Stable file families, independent runner/service per shard; no order-based balancing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: foundation
            tests: >-
              tests/test_cloud_sync.py
              tests/test_cloud_two_device_acceptance.py
              tests/test_cloud_c15_headless_cross_runtime.py
              tests/test_cloud_c17_v2_two_device_acceptance.py
              tests/test_cloud_c17_v2_three_device_conflict_acceptance.py
              tests/test_cloud_project_bootstrap.py
              tests/test_cloud_c16_bootstrap_cross_runtime.py
              tests/test_cloud_c18_metadata.py
              tests/test_cloud_c18_cover_gate.py
              tests/test_cloud_c18_cover_acceptance.py
              tests/test_cloud_c18_account.py
              tests/test_cloud_c18_structural.py
              tests/test_cloud_c18_structural_cross_runtime.py
              tests/test_cloud_c18_structural_integration.py
              tests/test_cloud_c18_catalog_integration.py
              tests/test_cloud_c18_authority_cross_runtime.py
              tests/test_cloud_c18_edges_cross_runtime.py
              tests/test_cloud_c18_compression_gate.py
              tests/test_cloud_c18_compression_acceptance.py
          - shard: content-action
            tests: >-
              tests/test_cloud_c18_content_note_gate.py
              tests/test_cloud_c18_content_note_acceptance.py
              tests/test_cloud_c18_map_gate.py
              tests/test_cloud_c18_map_acceptance.py
              tests/test_cloud_c18_document_gate.py
              tests/test_cloud_c18_document_acceptance.py
              tests/test_cloud_c18_external_progress_acceptance.py
              tests/test_cloud_c18_progress_gate.py
              tests/test_cloud_c18_game_gate.py
              tests/test_cloud_c18_game_acceptance.py
              tests/test_cloud_c18_content_action_integration.py
              tests/test_cloud_c18_progress_acceptance.py
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloud_test_user
          POSTGRES_PASSWORD: cloud_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cloud_test_user -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-backend.txt
            requirements-test.txt

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v24
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install native headless proof dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Wait for PostgreSQL service
        env:
          PGPASSWORD: cloud_test_password
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U cloud_test_user -d postgres; then
              exit 0
            fi
            sleep 1
          done
          echo 'PostgreSQL service did not become ready.' >&2
          exit 1

      - name: Create disposable test database
        env:
          PGPASSWORD: cloud_test_password
        run: |
          psql -h 127.0.0.1 -p 5432 -U cloud_test_user -d postgres \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE nfprogress_c1_test'

      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-backend.txt -r requirements-test.txt

      - name: Install frontend dependencies for production crypto bridge
        run: npm ci
        working-directory: frontend

      - name: Verify native Note legacy and framed readers
        if: matrix.shard == 'foundation'
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib note_sync

      - name: Verify native account catalog
        if: matrix.shard == 'foundation'
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib account_catalog

      - name: Verify native account transport and crypto vector boundary
        if: matrix.shard == 'foundation'
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib account_sync

      - name: Native bounded compression and cross-language vectors
        if: matrix.shard == 'foundation'
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib frame_compression

      - name: Native metadata cover vectors and atomic apply
        if: matrix.shard == 'foundation'
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib cover_

      - name: Native document codec and authority
        if: matrix.shard == 'foundation'
        run: |
          cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib document_codec
          cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib document_sync
          cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib progress_

      - name: Run mandatory sync ACK and multi-device backend acceptance without skips
        env:
          NFPROGRESS_ENV: test
          NFPROGRESS_TEST_DATABASE_URL: postgresql+psycopg://cloud_test_user:cloud_test_password@127.0.0.1:5432/nfprogress_c1_test
        run: |
          set +e
          set -o pipefail
          python -m pytest -q -rs ${{ matrix.tests }} 2>&1 | tee "$RUNNER_TEMP/c16-mandatory-acceptance.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if [ "${statuses[0]}" -ne 0 ] || [ "${statuses[1]}" -ne 0 ]; then
            echo 'Mandatory sync acceptance failed; pytest output is above.' >&2
            exit 1
          fi
          if grep -Eiq '[0-9]+ skipped|SKIPPED' "$RUNNER_TEMP/c16-mandatory-acceptance.log"; then
            echo 'Mandatory sync acceptance unexpectedly skipped tests.' >&2
            exit 1
          fi

  regressions:
    name: PostgreSQL cloud and legacy regressions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloud_test_user
          POSTGRES_PASSWORD: cloud_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cloud_test_user -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-backend.txt
            requirements-test.txt

      - name: Wait for PostgreSQL service
        env:
          PGPASSWORD: cloud_test_password
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U cloud_test_user -d postgres; then
              exit 0
            fi
            sleep 1
          done
          echo 'PostgreSQL service did not become ready.' >&2
          exit 1

      - name: Create disposable test database
        env:
          PGPASSWORD: cloud_test_password
        run: |
          psql -h 127.0.0.1 -p 5432 -U cloud_test_user -d postgres \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE nfprogress_c1_test'

      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-backend.txt -r requirements-test.txt

      - name: Run focused cloud and legacy API tests
        env:
          NFPROGRESS_ENV: test
          NFPROGRESS_TEST_DATABASE_URL: postgresql+psycopg://cloud_test_user:cloud_test_password@127.0.0.1:5432/nfprogress_c1_test
        run: |
          python -m pytest -q \
            tests/test_cloud_postgresql_foundation.py \
            tests/test_cloud_auth.py \
            tests/test_cloud_email_recovery.py \
            tests/test_cloud_registration.py \
            tests/test_cloud_limits.py \
            tests/test_cloud_reserved_usernames.py \
            tests/test_cloud_admin.py \
            tests/test_cloud_projects.py \
            tests/test_cloud_encrypted_schema.py \
            tests/test_cloud_encrypted_sync.py \
            tests/test_cloud_encrypted_sync_v2.py \
            tests/test_cloud_encrypted_blobs.py \
            tests/test_c9_sqlite_sync.py \
            tests/test_api.py tests/test_c18_external_local_boundary.py

  frontend-admin:
    name: Frontend admin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v24
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test -- --run src/cloud/contentActionIntegration.spec.ts src/cloud/frameCompression.spec.ts src/cloud/compressionCorpus.spec.ts src/cloud/compressionWriter.spec.ts src/cloud/localBindingBoundary.spec.ts src/components/documents/LocalWordBindingPanel.spec.ts src/App.spec.ts src/router/index.spec.ts src/api/admin.spec.ts src/api/client.spec.ts src/api/accountCrypto.spec.ts src/api/cloudProjects.spec.ts src/auth/userAuth.spec.ts src/auth/accountBinding.spec.ts src/auth/keyContext.spec.ts src/cloud/accountCryptoProvisioning.spec.ts src/stores/cloudSession.spec.ts src/components/settings/CloudSyncSettingsCard.spec.ts src/components/settings/ProjectMetadataAuthorityPanel.spec.ts src/cloud/projectState.spec.ts src/cloud/projectBootstrap.spec.ts src/cloud/syncProtocol.spec.ts src/api/base64url.spec.ts src/api/encryptedSync.spec.ts src/api/encryptedSyncV2.spec.ts src/cloud/noteSyncTwoDeviceCryptoAcceptance.spec.ts src/cloud/noteSyncHeadlessCryptoBridge.spec.ts src/cloud/syncTimestamp.spec.ts src/cloud/noteSyncCodec.spec.ts src/cloud/noteSyncCodec.golden.spec.ts src/cloud/noteSyncResolutionV2Codec.spec.ts src/cloud/noteSyncResolutionSealing.spec.ts src/cloud/projectMetadataCodec.spec.ts src/cloud/projectCoverReference.spec.ts src/cloud/projectCoverRuntime.spec.ts src/components/settings/ProjectCoverAuthorityPanel.spec.ts src/cloud/stageCodec.spec.ts src/cloud/stageStructuralRuntime.spec.ts src/components/settings/StageStructuralAuthorityPanel.spec.ts src/cloud/noteSyncIntent.spec.ts src/cloud/noteSyncIntent.authority.spec.ts src/cloud/noteSyncUpload.spec.ts src/cloud/noteSyncPull.spec.ts src/cloud/noteSyncInbox.spec.ts src/cloud/noteSyncV2Transport.spec.ts src/cloud/noteSyncInboxDecrypt.spec.ts src/cloud/noteSyncInboxApply.spec.ts src/cloud/noteSyncResolutionInboxApply.spec.ts src/cloud/noteSyncDeviceAck.spec.ts src/cloud/noteSyncOrchestrator.spec.ts src/cloud/noteSyncRuntime.spec.ts src/cloud/noteSyncTransportRouter.spec.ts src/cloud/projectCoverCrypto.spec.