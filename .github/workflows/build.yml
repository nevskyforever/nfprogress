name: Build and publish Windows desktop release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Описание обновления. Если пусто, используется стандартный текст.'
        required: false
        type: string
      telegram_message:
        description: 'Отдельный текст для Telegram. Если пусто, используется описание обновления.'
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_windows:
    name: Build Tauri/NSIS release
    if: >-
      github.ref == 'refs/heads/main' &&
      (contains(github.event.head_commit.message, 'Обновление') || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_notes: ${{ steps.release_notes.outputs.release_notes }}
      telegram_message: ${{ steps.release_notes.outputs.telegram_message }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-backend.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: frontend/src-tauri -> frontend/src-tauri/target
          shared-key: tauri-windows-x86_64

      - name: Restore Nuitka cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-python-3.13-${{ hashFiles('requirements-backend.txt', 'scripts/build-backend-sidecar.py') }}
          restore-keys: |
            nuitka-${{ runner.os }}-python-3.13-

      - name: Read and validate application version
        id: version
        shell: pwsh
        run: |
          python scripts\sync-tauri-versions.py
          $version = (python scripts\sync-tauri-versions.py --version-only).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "engine.version is not semantic: $version"
          }
          $tauriVersion = (Get-Content frontend\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('frontend/src-tauri/Cargo.toml').read_text(encoding='utf-8'))['package']['version'])"
          if ($version -ne $tauriVersion -or $version -ne $cargoVersion.Trim()) {
            throw "Release versions differ: engine=$version, tauri=$tauriVersion, cargo=$cargoVersion"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Prepare release notes
        id: release_notes
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          MANUAL_RELEASE_NOTES: ${{ inputs.release_notes }}
          MANUAL_TELEGRAM_MESSAGE: ${{ inputs.telegram_message }}
        run: |
          $releaseNotes = ([string]$env:MANUAL_RELEASE_NOTES).Trim()
          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
            $message = ($env:COMMIT_MESSAGE -replace "`r`n", "`n")
            $lines = $message -split "`n"
            $headerIndex = -1
            for ($index = 0; $index -lt $lines.Count; $index++) {
              if ($lines[$index] -match '^[ \t]*Обновление[ \t]+[0-9]+\.[0-9]+(?:\.[0-9]+)?[ \t]*$') {
                $headerIndex = $index
                break
              }
            }
            if ($headerIndex -ge 0 -and $headerIndex + 1 -lt $lines.Count) {
              $releaseNotes = ($lines[($headerIndex + 1)..($lines.Count - 1)] -join "`n").Trim()
            }
          }
          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
            $releaseNotes = "Исправлены ошибки и улучшена стабильность."
          }
          $telegramMessage = ([string]$env:MANUAL_TELEGRAM_MESSAGE).Trim()
          if ([string]::IsNullOrWhiteSpace($telegramMessage)) {
            $telegramMessage = $releaseNotes
          }
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.txt"
          [System.IO.File]::WriteAllText($notesPath, $releaseNotes, [System.Text.UTF8Encoding]::new($false))
          "RELEASE_NOTES_FILE=$notesPath" >> $env:GITHUB_ENV
          $releaseNotesDelimiter = "notes_$([Guid]::NewGuid().ToString('N'))"
          "release_notes<<$releaseNotesDelimiter" >> $env:GITHUB_OUTPUT
          $releaseNotes >> $env:GITHUB_OUTPUT
          $releaseNotesDelimiter >> $env:GITHUB_OUTPUT
          $telegramDelimiter = "telegram_$([Guid]::NewGuid().ToString('N'))"
          "telegram_message<<$telegramDelimiter" >> $env:GITHUB_OUTPUT
          $telegramMessage >> $env:GITHUB_OUTPUT
          $telegramDelimiter >> $env:GITHUB_OUTPUT

      - name: Install backend build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-backend.txt "nuitka>=4.1.3,<5" zstandard pytest

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: frontend
        run: npm ci

      - name: Run release metadata and frontend checks
        shell: pwsh
        run: |
          python -m pytest -q `
            tests\test_tauri_release_metadata.py `
            tests\test_content_services.py `
            tests\test_core_import_boundary.py `
            tests\test_document_integrations.py
          Push-Location frontend
          try {
            npm run typecheck
            npm run lint
            npm run test
            npm run build
          } finally {
            Pop-Location
          }

      - name: Validate Tauri updater keys
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY || secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $required = @{
            TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_SIGNING_PRIVATE_KEY
            TAURI_UPDATER_PUBLIC_KEY = $env:TAURI_UPDATER_PUBLIC_KEY
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "Automatic updates require GitHub secrets/variables: $($missing -join ', ')."
          }
          $publicKeyPath = Join-Path $env:RUNNER_TEMP "tauri-updater.pub"
          $publicKey = ($env:TAURI_UPDATER_PUBLIC_KEY -replace '\\n', "`n").Trim()
          [System.IO.File]::WriteAllText($publicKeyPath, $publicKey, [System.Text.UTF8Encoding]::new($false))
          "TAURI_UPDATER_PUBLIC_KEY_FILE=$publicKeyPath" >> $env:GITHUB_ENV

      - name: Build Python sidecar
        shell: pwsh
        run: python scripts\build-backend-sidecar.py --target x86_64-pc-windows-msvc

      - name: Smoke-test Python sidecar
        shell: pwsh
        run: |
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          $token = [Convert]::ToHexString([System.Security.Cryptography.RandomNumberGenerator]::GetBytes(32)).ToLowerInvariant()
          $env:NFPROGRESS_SESSION_TOKEN = $token
          $env:NFPROGRESS_ALLOWED_ORIGINS = 'tauri://localhost,http://tauri.localhost,https://tauri.localhost'
          $sidecar = Resolve-Path "frontend\src-tauri\binaries\nfprogress-backend-x86_64-pc-windows-msvc.exe"
          $dataDir = Join-Path $env:RUNNER_TEMP "nfprogress-sidecar-smoke"
          $stdoutPath = Join-Path $env:RUNNER_TEMP "nfprogress-sidecar.stdout.log"
          $stderrPath = Join-Path $env:RUNNER_TEMP "nfprogress-sidecar.stderr.log"
          $process = Start-Process `
            -FilePath $sidecar `
            -ArgumentList @('--host', '127.0.0.1', '--port', $port, '--platform', 'desktop', '--parent-pid', $PID, '--data-dir', $dataDir, '--log-level', 'warning') `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath `
            -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $healthy = $false
            while ((Get-Date) -lt $deadline -and -not $process.HasExited) {
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:$port/health" -TimeoutSec 2
                if ($response.status -eq 'ok') {
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $healthy) {
              Write-Host "Sidecar exited: $($process.HasExited); exit code: $($process.ExitCode)"
              if (Test-Path $stdoutPath) { Write-Host '--- sidecar stdout ---'; Get-Content $stdoutPath }
              if (Test-Path $stderrPath) { Write-Host '--- sidecar stderr ---'; Get-Content $stderrPath }
              throw "The Python sidecar did not become healthy."
            }
            Invoke-RestMethod `
              -Uri "http://127.0.0.1:$port/api/settings" `
              -Headers @{ 'X-NFProgress-Token' = $token } `
              -TimeoutSec 10 |
              Out-Null
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Create Tauri release configuration
        shell: pwsh
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.release.conf.json"
          python scripts\create-tauri-release-config.py `
            --version $env:APP_VERSION `
            --repository $env:GITHUB_REPOSITORY `
            --public-key-file $env:TAURI_UPDATER_PUBLIC_KEY_FILE `
            --output $configPath
          "TAURI_RELEASE_CONFIG=$configPath" >> $env:GITHUB_ENV

      - name: Check and build Tauri desktop
        shell: pwsh
        working-directory: frontend
        env:
          NFPROGRESS_UPDATER_ENABLED: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo fmt --manifest-path src-tauri\Cargo.toml --check
          cargo check --manifest-path src-tauri\Cargo.toml --target x86_64-pc-windows-msvc --locked
          npx tauri build `
            --target x86_64-pc-windows-msvc `
            --bundles nsis `
            --config $env:TAURI_RELEASE_CONFIG

      - name: Verify updater artifact and prepare release assets
        shell: pwsh
        run: |
          $targetRoot = "frontend\src-tauri\target\x86_64-pc-windows-msvc\release"
          $installer = Get-ChildItem "$targetRoot\bundle\nsis" -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw "Tauri did not create an NSIS installer." }
          $updaterSignature = "$($installer.FullName).sig"
          if (-not (Test-Path $updaterSignature)) { throw "Tauri did not create the updater signature." }
          if ([string]::IsNullOrWhiteSpace((Get-Content $updaterSignature -Raw))) {
            throw "The Tauri updater signature is empty."
          }
          $assets = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          $assetName = "nfprogress-windows-x86_64-$($env:APP_VERSION)-setup.exe"
          $assetPath = Join-Path $assets $assetName
          Copy-Item $installer.FullName $assetPath -Force
          Copy-Item $updaterSignature "$assetPath.sig" -Force
          python scripts\create-tauri-update-manifest.py `
            --version $env:APP_VERSION `
            --repository $env:GITHUB_REPOSITORY `
            --tag "v$($env:APP_VERSION)" `
            --artifact $assetPath `
            --signature "$assetPath.sig" `
            --notes-file $env:RELEASE_NOTES_FILE `
            --output "$assets\latest.json"

          $hashLines = @()
          foreach ($file in Get-ChildItem $assets -File | Sort-Object Name) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashLines += "$hash  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines(
            "$assets\SHA256SUMS.txt",
            $hashLines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Store Windows release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tauri-windows-${{ steps.version.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish_release:
    name: Publish GitHub release
    needs: build_windows
    if: >-
      always() &&
      (needs.build_windows.result == 'success' || needs.build_windows.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      APP_VERSION: ${{ needs.build_windows.outputs.version }}
      RELEASE_NOTES: ${{ needs.build_windows.outputs.release_notes }}
      TELEGRAM_MESSAGE: ${{ needs.build_windows.outputs.telegram_message }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: tauri-windows-${{ needs.build_windows.outputs.version }}
          path: release-assets

      - name: Download macOS release files from hosting
        shell: bash
        env:
          APP_VERSION: ${{ needs.build_windows.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          base_url="https://nfproject.ru/app"
          downloaded=0
          for arch in arm intel; do
            file="nfprogress-mac-${arch}-${APP_VERSION}.zip"
            asset_path="release-assets/${file}"
            if curl --fail --location --retry 3 \
              --output "$asset_path" \
              "${base_url}/${file}"; then
              unzip -t "$asset_path"
              downloaded=$((downloaded + 1))
            else
              rm -f "$asset_path"
              echo "macOS ${arch} build is unavailable; continuing without it."
            fi
          done
          echo "Downloaded macOS builds: ${downloaded}"

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          installer="release-assets/nfprogress-windows-x86_64-${APP_VERSION}-setup.exe"
          build_count=0

          if [[ -s "$installer" ]]; then
            test -s "${installer}.sig"
            test -s release-assets/latest.json
            test -s release-assets/SHA256SUMS.txt
            jq -e --arg version "$APP_VERSION" \
              '.version == $version and (.platforms["windows-x86_64"].signature | length > 0)' \
              release-assets/latest.json >/dev/null
            build_count=$((build_count + 1))
          fi

          for mac_asset in release-assets/nfprogress-mac-*.zip; do
            [[ -e "$mac_asset" ]] || continue
            test -s "$mac_asset"
            build_count=$((build_count + 1))
          done

          if (( build_count == 0 )); then
            echo "No valid release builds were found." >&2
            exit 1
          fi
          echo "Validated release builds: ${build_count}"

      - name: Update legacy release manifest
        shell: pwsh
        run: |
          $remoteManifest = Join-Path $env:RUNNER_TEMP "update_manifest.remote.json"
          try {
            Invoke-WebRequest `
              -Uri "https://nfproject.ru/app/update_manifest.json" `
              -OutFile $remoteManifest `
              -TimeoutSec 30
            $parsed = Get-Content $remoteManifest -Raw | ConvertFrom-Json
            if (-not $parsed) { throw "Remote manifest is empty." }
            Move-Item $remoteManifest update_manifest.json -Force
          } catch {
            Write-Warning "Current remote manifest is unavailable; using the repository copy: $_"
          }
          $env:RELEASE_NOTES = Get-Content $env:RELEASE_NOTES_FILE -Raw
          python scripts\update-release-manifest.py `
            $env:APP_VERSION `
            windows
          python scripts\create-legacy-manifest.py
          Copy-Item update_manifest.json release-assets\update_manifest.json -Force
          Copy-Item update_manifest_legacy.json release-assets\update_manifest_legacy.json -Force

      - name: Upload Windows release files to hosting
        shell: bash
        env:
          SSH_UPLOAD_HOST: 77.222.62.219
          SSH_UPLOAD_USER: nevskyfore
          SSH_UPLOAD_DIR: nfproject/public_html/app
          SSH_UPLOAD_PORT: 22
          SSH_UPLOAD_PRIVATE_KEY: ${{ secrets.SSH_UPLOAD_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SSH_UPLOAD_PRIVATE_KEY" ]]; then
            echo "SSH upload skipped: SSH_UPLOAD_PRIVATE_KEY is not configured."
            exit 0
          fi

          key_path="$RUNNER_TEMP/nfprogress-ssh-upload-key"
          printf '%b\n' "$SSH_UPLOAD_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          ssh_options=(-i "$key_path" -p "$SSH_UPLOAD_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30)
          scp_options=(-i "$key_path" -P "$SSH_UPLOAD_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30)
          target="${SSH_UPLOAD_USER}@${SSH_UPLOAD_HOST}"

          ssh "${ssh_options[@]}" "$target" "mkdir -p '$SSH_UPLOAD_DIR'"
          for asset in release-assets/*; do
            scp "${scp_options[@]}" "$asset" "$target:$SSH_UPLOAD_DIR/"
          done

      - name: Publish GitHub release and updater manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="v${APP_VERSION}"
          notes_file="$RUNNER_TEMP/release-notes.txt"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_type=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.type')
            tag_commit=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')
            if [[ "$tag_type" == "tag" ]]; then
              tag_commit=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_commit}" --jq '.object.sha')
            fi
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Release ${tag} already points to ${tag_commit}; update engine.version first." >&2
              exit 1
            fi
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "nfprogress ${APP_VERSION}" \
              --notes-file "$notes_file" \
              --latest
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "nfprogress ${APP_VERSION}" \
              --notes-file "$notes_file" \
              --latest
          fi

      - name: Notify Telegram channel
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHANNEL_ID" ]]; then
            echo "Telegram notification skipped: credentials are not configured."
            exit 0
          fi
          message=${TELEGRAM_MESSAGE:-"Обновление ${APP_VERSION}"}
          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHANNEL_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" >/dev/null
