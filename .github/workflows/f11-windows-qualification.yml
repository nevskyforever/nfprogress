name: F11 Windows qualification

on:
  workflow_dispatch:
    inputs:
      sign_windows:
        description: 'Use the optional Authenticode signing gate'
        required: true
        default: false
        type: boolean
      enable_tauri_updater:
        description: 'Build with the optional Tauri updater configuration'
        required: true
        default: false
        type: boolean
      run_installer_smoke:
        description: 'Run the NSIS silent install smoke on this runner'
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  qualify-windows:
    name: Windows x86_64 F11 qualification
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout dispatch ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - name: Record exact checkout provenance
        id: provenance
        shell: pwsh
        run: |
          $commitSha = (git rev-parse HEAD).Trim()
          if ($commitSha -notmatch '^[0-9a-f]{40}$') {
            throw "Unexpected checkout SHA: $commitSha"
          }
          "commit_sha=$commitSha" >> $env:GITHUB_OUTPUT
          "F11_COMMIT_SHA=$commitSha" >> $env:GITHUB_ENV
          @(
            "commit_sha=$commitSha"
            "dispatch_ref=$env:GITHUB_REF"
            "workflow_sha=$env:GITHUB_SHA"
            "runner=$env:RUNNER_NAME"
            "target=x86_64-pc-windows-msvc"
            "distribution_policy=unsigned-qualification-unless-sign_windows"
          ) | Set-Content -LiteralPath "$env:RUNNER_TEMP\f11-provenance.txt" -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-backend.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust/MSVC
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest pyinstaller -r requirements-backend.txt
          npm --prefix frontend ci --prefer-offline --no-audit --no-fund

      - name: Run frontend checks
        shell: pwsh
        run: |
          Push-Location frontend
          try {
            npm run typecheck
            npm run test
            npm run build
          }
          finally {
            Pop-Location
          }

      - name: Run Rust checks
        shell: pwsh
        run: |
          cargo fmt --manifest-path frontend\src-tauri\Cargo.toml --check
          cargo check --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc
          cargo test --manifest-path frontend\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc

      - name: Prepare isolated Windows fixture and path evidence
        shell: pwsh
        run: |
          $profileRoot = Join-Path $env:RUNNER_TEMP 'f11-windows-profile'
          $appData = Join-Path $profileRoot 'AppData\Roaming'
          $userProfile = Join-Path $profileRoot 'UserProfile'
          $source = Join-Path $profileRoot 'legacy-source'
          $fallback = Join-Path $userProfile 'Documents\nfprogress'
          New-Item -ItemType Directory -Force -Path $appData, $userProfile, $source, $fallback | Out-Null
          "F11_APPDATA=$appData" >> $env:GITHUB_ENV
          "F11_USERPROFILE=$userProfile" >> $env:GITHUB_ENV
          "F11_FIXTURE_SOURCE=$source" >> $env:GITHUB_ENV
          "F11_FALLBACK_ROOT=$fallback" >> $env:GITHUB_ENV
          $env:F11_FIXTURE_SOURCE = $source
          python -c "import json, os, pickle; from pathlib import Path; from tests.test_f9_migration_helper import _fixture; root=Path(os.environ['F11_FIXTURE_SOURCE']); project, state=_fixture(root); existing=root/'existing.docx'; existing.write_bytes('fixture Word binding'.encode()); project.synch['path']=str(existing); documents=json.loads((root/'documents.json').read_text(encoding='utf-8')); documents['chapter']['docx_path']=str(root/'missing-scrivener.docx'); documents['chapter']['sync_state']='linked'; (root/'documents.json').write_text(json.dumps(documents, ensure_ascii=False), encoding='utf-8'); (root/'data.pkl').write_bytes(pickle.dumps(state, protocol=4))"
          Copy-Item -LiteralPath "$source\data.pkl" -Destination "$fallback\data.pkl"
          $env:APPDATA = $appData
          $env:USERPROFILE = $userProfile
          $resolved = (python -c "import engine; print(engine.get_app_data_dir())").Trim()
          $expected = (Join-Path $appData 'nfprogress')
          if ((Resolve-Path $resolved).Path -ne (Resolve-Path $expected).Path) {
            throw "Windows legacy path resolution mismatch: resolved=$resolved expected=$expected"
          }
          if (-not (Test-Path "$expected\data.pkl" -PathType Leaf)) {
            throw 'Windows legacy fallback was not copied into %APPDATA%\\nfprogress.'
          }
          Remove-Item -LiteralPath $expected -Recurse -Force
          @(
            "appdata_nfprogress=$appData\nfprogress"
            "historical_fallback=$fallback"
            "fixture_source=$source"
            "fixture_isolated=true"
            "engine_resolved_path=$resolved"
            "legacy_fallback_copy=PASS"
          ) | Set-Content -LiteralPath "$env:RUNNER_TEMP\path-resolution.txt" -Encoding utf8

      - name: Build packaged migration helper
        shell: pwsh
        run: |
          python scripts\build-migration-helper.py --output dist\nf11-nfprogress-migration-helper.exe
          $helper = Resolve-Path dist\nf11-nfprogress-migration-helper.exe
          if ([IO.Path]::GetExtension($helper.Path) -ne '.exe') { throw 'Helper is not a Windows executable.' }
          Get-Item -LiteralPath $helper.Path | Format-List FullName,Length

      - name: Run helper detect preview prepare verify
        shell: pwsh
        run: |
          $helper = (Resolve-Path dist\nf11-nfprogress-migration-helper.exe).Path
          $source = $env:F11_FIXTURE_SOURCE
          & $helper detect --source $source --json | Tee-Object "$env:RUNNER_TEMP\helper-detect.json"
          if ($LASTEXITCODE -ne 0) { throw "helper detect failed: $LASTEXITCODE" }
          & $helper preview --source $source --json | Tee-Object "$env:RUNNER_TEMP\helper-preview.json"
          if ($LASTEXITCODE -ne 0) { throw "helper preview failed: $LASTEXITCODE" }
          & $helper prepare --source $source --json | Tee-Object "$env:RUNNER_TEMP\helper-prepare.json"
          if ($LASTEXITCODE -ne 0) { throw "helper prepare failed: $LASTEXITCODE" }
          & $helper verify --source $source --json | Tee-Object "$env:RUNNER_TEMP\helper-verify.json"
          if ($LASTEXITCODE -ne 0) { throw "helper verify failed: $LASTEXITCODE" }
          $verify = Get-Content "$env:RUNNER_TEMP\helper-verify.json" -Raw | ConvertFrom-Json
          if ($verify.status -ne 'READY_FOR_TAURI') { throw "Unexpected helper status: $($verify.status)" }

      - name: Verify migrated SQLite and recovery preservation
        shell: pwsh
        run: |
          $source = $env:F11_FIXTURE_SOURCE
          if (-not (Test-Path "$source\nfprogress.db" -PathType Leaf)) { throw 'Prepared SQLite is missing.' }
          if (-not (Test-Path "$source\backups" -PathType Container)) { throw 'Migration backup is missing.' }
          if (-not (Test-Path "$source\data.pkl" -PathType Leaf)) { throw 'Legacy source was not preserved.' }
          $env:F11_VERIFY_ROOT = $source
          python -c "import os, sqlite3; from pathlib import Path; root=Path(os.environ['F11_VERIFY_ROOT']); db=sqlite3.connect(root/'nfprogress.db'); assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'; assert db.execute('PRAGMA foreign_key_check').fetchall()==[]; assert db.execute('SELECT COUNT(*) FROM projects').fetchone()[0]==1; assert db.execute('SELECT COUNT(*) FROM stages').fetchone()[0]==1; assert db.execute('SELECT COUNT(*) FROM notes').fetchone()[0]==2; assert db.execute('SELECT COUNT(*) FROM documents').fetchone()[0]==2; db.close(); print('integrity_check=ok foreign_key_check=ok source_preserved=true backup_preserved=true')"

      - name: Build unsigned Tauri Windows qualification artifact
        shell: pwsh
        working-directory: frontend
        env:
          NFPROGRESS_TAURI_RELEASE_UPLOAD: '0'
        run: |
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Sign Windows artifacts through optional fail-closed gate
        if: inputs.sign_windows == true && inputs.enable_tauri_updater == false
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'https://timestamp.digicert.com' }}
        run: |
          $targetRoot = 'frontend\src-tauri\target\x86_64-pc-windows-msvc\release'
          $installer = Get-ChildItem "$targetRoot\bundle\nsis" -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Signing requested but NSIS installer is missing.' }
          & "$env:GITHUB_WORKSPACE\scripts\sign-windows-artifacts.ps1" `
            -Path @("$targetRoot\nfprogress-desktop.exe", 'dist\nf11-nfprogress-migration-helper.exe', $installer.FullName)

      - name: Configure optional Tauri updater qualification
        if: inputs.enable_tauri_updater == true
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY || secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $missing = @(
            if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { 'TAURI_SIGNING_PRIVATE_KEY' }
            if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) { 'TAURI_UPDATER_PUBLIC_KEY' }
          )
          if ($missing.Count -gt 0) { throw "Updater qualification requires: $($missing -join ', ')." }
          $version = (node scripts\sync-tauri-versions.mjs --version-only).Trim()
          $publicKeyPath = Join-Path $env:RUNNER_TEMP 'f11-tauri-updater.pub'
          ($env:TAURI_UPDATER_PUBLIC_KEY -replace '\\n', "`n").Trim() | Set-Content -LiteralPath $publicKeyPath -Encoding utf8
          $configPath = Join-Path $env:RUNNER_TEMP 'f11-tauri-release.conf.json'
          python scripts\create-tauri-release-config.py --version $version --repository $env:GITHUB_REPOSITORY --public-key-file $publicKeyPath --output $configPath
          "TAURI_RELEASE_CONFIG=$configPath" >> $env:GITHUB_ENV
          "NFPROGRESS_UPDATER_ENABLED=1" >> $env:GITHUB_ENV

      - name: Rebuild with optional Tauri updater qualification
        if: inputs.enable_tauri_updater == true
        shell: pwsh
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --config $env:TAURI_RELEASE_CONFIG

      - name: Sign updater-enabled Windows artifacts through optional gate
        if: inputs.sign_windows == true && inputs.enable_tauri_updater == true
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'https://timestamp.digicert.com' }}
        run: |
          $targetRoot = 'frontend\src-tauri\target\x86_64-pc-windows-msvc\release'
          $installer = Get-ChildItem "$targetRoot\bundle\nsis" -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Signing requested but updater-enabled NSIS installer is missing.' }
          & "$env:GITHUB_WORKSPACE\scripts\sign-windows-artifacts.ps1" -Path @("$targetRoot\nfprogress-desktop.exe", 'dist\nf11-nfprogress-migration-helper.exe', $installer.FullName)

      - name: Inspect Windows package and record hashes
        id: artifacts
        shell: pwsh
        env:
          SIGN_WINDOWS: ${{ inputs.sign_windows }}
        run: |
          $targetRoot = 'frontend\src-tauri\target\x86_64-pc-windows-msvc\release'
          $installer = Get-ChildItem "$targetRoot\bundle\nsis" -Filter '*-setup.exe' | Select-Object -First 1
          $executable = Get-Item "$targetRoot\nfprogress-desktop.exe"
          if (-not $installer) { throw 'Tauri did not create an NSIS installer.' }
          if (-not $executable) { throw 'Tauri release executable is missing.' }
          $forbidden = Get-ChildItem $targetRoot -Recurse -File | Where-Object {
            $_.Name -match '(^|[-_.])(python|fastapi|nuitka)([-_.]|$)|\.py$'
          }
          if ($forbidden.Count -gt 0) {
            throw "Tauri package contains forbidden Python/backend files: $($forbidden.FullName -join ', ')"
          }
          $installerHash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $executableHash = (Get-FileHash $executable.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerSignature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          $executableSignature = Get-AuthenticodeSignature -LiteralPath $executable.FullName
          if ($env:SIGN_WINDOWS -eq 'true') {
            if ($installerSignature.Status -ne 'Valid' -or $executableSignature.Status -ne 'Valid') {
              throw "Requested Authenticode qualification but status is installer=$($installerSignature.Status), executable=$($executableSignature.Status)."
            }
          }
          @(
            "installer=$($installer.Name)"
            "installer_format=NSIS"
            "installer_size=$($installer.Length)"
            "installer_sha256=$installerHash"
            "installer_authenticode=$($installerSignature.Status)"
            "executable=$($executable.Name)"
            "executable_size=$($executable.Length)"
            "executable_sha256=$executableHash"
            "executable_authenticode=$($executableSignature.Status)"
            "tauri_runtime_package_audit=PASS"
            "architecture=x86_64-pc-windows-msvc"
            "commit_sha=$env:F11_COMMIT_SHA"
          ) | Set-Content -LiteralPath "$env:RUNNER_TEMP\windows-artifact-evidence.txt" -Encoding utf8
          Copy-Item -LiteralPath $installer.FullName -Destination "$env:RUNNER_TEMP\f11-nfprogress-windows-x86_64-$env:F11_COMMIT_SHA-setup.exe"

      - name: Run Tauri first-launch and restart process smoke
        shell: pwsh
        run: |
          $executable = (Resolve-Path 'frontend\src-tauri\target\x86_64-pc-windows-msvc\release\nfprogress-desktop.exe').Path
          $dataRoot = Join-Path $env:F11_APPDATA 'nfprogress'
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          Copy-Item -LiteralPath "$env:F11_FIXTURE_SOURCE\nfprogress.db" -Destination "$dataRoot\nfprogress.db"
          Copy-Item -LiteralPath "$env:F11_FIXTURE_SOURCE\nfprogress-migration.json" -Destination "$dataRoot\nfprogress-migration.json"
          $env:APPDATA = $env:F11_APPDATA
          $env:USERPROFILE = $env:F11_USERPROFILE
          $process = Start-Process -FilePath $executable -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) { throw "Tauri first launch exited with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force
          $process = Start-Process -FilePath $executable -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) { throw "Tauri restart exited with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force
          $env:F11_VERIFY_ROOT = $dataRoot
          python -c "import os, sqlite3; from pathlib import Path; root=Path(os.environ['F11_VERIFY_ROOT']); db=sqlite3.connect(root/'nfprogress.db'); assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'; assert db.execute('SELECT COUNT(*) FROM projects').fetchone()[0]==1; assert db.execute('SELECT COUNT(*) FROM documents').fetchone()[0]==2; db.close(); print('first_launch=process_alive restart=process_alive no_reimport=true no_duplication=true')"

      - name: Run optional NSIS current-user install smoke
        if: inputs.run_installer_smoke == true
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'frontend\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis' -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer smoke requested but NSIS installer is missing.' }
          $result = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "NSIS silent install failed with exit code $($result.ExitCode)." }
          $installed = Get-ChildItem $env:LOCALAPPDATA -Filter 'nfprogress-desktop.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw 'NSIS install completed but installed executable was not found.' }
          "installer_exit=$($result.ExitCode)" | Set-Content "$env:RUNNER_TEMP\installer-evidence.txt" -Encoding utf8
          "installed_executable=$($installed.FullName)" | Add-Content "$env:RUNNER_TEMP\installer-evidence.txt" -Encoding utf8
          $shortcuts = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter '*nfprogress*' -Recurse -ErrorAction SilentlyContinue
          "start_menu_entries=$($shortcuts.Count)" | Add-Content "$env:RUNNER_TEMP\installer-evidence.txt" -Encoding utf8
          $env:APPDATA = $env:F11_APPDATA
          $env:USERPROFILE = $env:F11_USERPROFILE
          $installedProcess = Start-Process -FilePath $installed.FullName -PassThru
          Start-Sleep -Seconds 12
          if ($installedProcess.HasExited) { throw "Installed Tauri launch exited with code $($installedProcess.ExitCode)." }
          Stop-Process -Id $installedProcess.Id -Force
          "installed_launch=process_alive" | Add-Content "$env:RUNNER_TEMP\installer-evidence.txt" -Encoding utf8

      - name: Record unsigned qualification limitation
        if: inputs.sign_windows == false
        shell: pwsh
        run: |
          'Authenticode=NOT_TESTED_BY_POLICY; SmartScreen warning expected for unsigned distribution.' | Set-Content "$env:RUNNER_TEMP\windows-signing-limitation.txt" -Encoding utf8

      - name: Upload private qualification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: f11-windows-x86_64-${{ steps.provenance.outputs.commit_sha }}
          path: |
            ${{ github.workspace }}/frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            ${{ github.workspace }}/frontend/src-tauri/target/x86_64-pc-windows-msvc/release/nfprogress-desktop.exe
            ${{ github.workspace }}/dist/f11-nfprogress-migration-helper.exe
            ${{ runner.temp }}/f11-provenance.txt
            ${{ runner.temp }}/path-resolution.txt
            ${{ runner.temp }}/helper-*.json
            ${{ runner.temp }}/windows-artifact-evidence.txt
            ${{ runner.temp }}/installer-evidence.txt
            ${{ runner.temp }}/windows-signing-limitation.txt
          if-no-files-found: warn
          retention-days: 14
